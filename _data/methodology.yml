- heading: Methodology Information
  fields:
    - name: Name
      definition: The full name of the methodology.
      required: true
      example: Sustainable Web Design Model version 4
    - name: Short name
      definition: A short name or acronym that can be used when referencing the methodology. 
      required: true
      example: SWDMv4
    - name: Public URI
      definition: A public URI where people can access the methodology for reference and review.
      required: true
      example: https://sustainablewebdesign.org/estimating-digital-emissions/
    - name: Access type
      definition: "Details how the methodology can be accessed. One of:"
      options:
        - "Publicly available: Available for free without login or permissions."
        - "Limited availability: Available for free but requires login or permissions to access."
        - "Paid availability: Available only via purchase, payment, or subscription."
      required: true
      example: Publicly available
    - name: Commercial dependencies
      definition: "Does this methodology rely on proprietary, paid or closed data sources to generate an output? One of: "
      options:
        - "No: Open data sources can be used in this methodology"
        - "Yes: A proprietary data source is required for this methodology"
        - "Don’t know: It is unclear if this methodology requires proprietary data"
      required: true
      example: No
    - name: Open data source URIs
      definition: An array of URIs to pointing to suggested open data sources which should be used with this methodology.
      required: false
      example: "- Annual grid intensity: https://github.com/thegreenwebfoundation/co2.js/blob/main/data/output/electricity-maps/yearly_2025.json"
    - name: Output unit
      definition: The unit used to present the output of this methodology
      required: true
      example: gCO2e
    - name: Output certainty
      definition: "A general statement regarding the nature of the output generated by this methodology. One of:"
      options:
        - "Estimate: The final output is an approximation and includes a number of assumptions."
        - "Measurement: The final output relies on physical measurement to be achieved."
      required: true
      example: Estimate
    - name: Published date
      definition: The date the methodology was first published.
      required: true
      example: 4th June 2024
    - name: Last updated
      definition: The date when the methodology was last revised or updated.
      required: false
      example: 4th July 2024
    - name: Primary contact name
      definition: The primary contact person or organisation who can field questions about the methodology.
      required: true
      example: Mightybytes
    - name: Primary contact email/URL
      definition: Email address or online contact form through which the primary contact can be reached.
      required: true
      example: https://sustainablewebdesign.org/contact/
- heading: DIST Information
  fields:
    - name: Impact dimensions
      definition: "One or more DIST impact dimension to which this methodology relates. At least one of: "
      options: 
        - Carbon
        - Water
        - Health
      required: true 
      example: Carbon
    - name: DIST categories
      definition: "One or more DIST taxonomy categories to which this methodology can be applied to. At least one of: "
      options:
        - id: CatUSoftware
          title: Off The Shelf including AI models
        - id: CatUEmployeeHardware
          title: Employee Hardware
        - id: CatUNetworkHardware
          title: Networking Hardware
        - id: CatUServerHardware
          title: Servers and Storage Hardware
        - id: CatUContentData
          title: Content and Data
        - id: CatOServers
          title: Servers and Storage
        - id: CatONetworkDevices
          title: Networking and Infrastructure
        - id: CatOEmployeeDevices
          title: Employee Devices
        - id: CatGGenerators
          title: Generators
        - id: CatCCloud
          title: Cloud Services
        - id: CatCSaas
          title: SaaS
        - id: CatCManaged
          title: Managed Services
        - id: CatDEndUserDevices
          title: End-User Devices
        - id: CatDNetworkDataTransfer
          title: Network Data Transfer
      required: true
      example: "- CatUSoftware\n\n- CatDEndUserDevices"
    - name: Carbon intensity type
      definition: '<b>(Carbon impact dimension only)</b>Specify whether this methodology relies on <a href="https://developers.thegreenwebfoundation.org/co2js/data/overview/#average-and-marginal-intensity-explained">average or marginal emissions</a>. One of: '
      options:
        - Average intensity
        - Marginal intensity
      required: true
      example: Average intensity
    - name: Framework alignment
      definition: '<b>(Carbon impact dimension only)</b>Specify whether this methodology aligns with existing recognised carbon accounting or reporting standards.'
      required: false
      example: "- SBTi\n\n- Greenhouse Gas Protocol Scope 2"

- heading: Methodology License Information
  fields: 
    - name: Type of license
      definition: The legal framework governing the use, distribution, and modification of the methodology.
      required: false
      example: Open Government License
    - name: License URI
      definition: Link to the full text of the license associated with the methodology, for reference and cross-validation.
      required: false
      example: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/1/open-government-licence.htm
    - name: License details
      definition: A summary of the permissions and restrictions outlined in the methodology’s license. 
      required: false
      example: Copy, publish, distribute and transmit the Information; Contains public sector information licensed under the Open Government Licence v1.0

- heading: Submission & Review Information
  fields:
    - name: Submission status
      definition: "The status of the methodology within the DIST Methodology Map. Currently only:"
      options:
        - "Self-assessed: The methodology has been submitted to DIST but not gone through a formal review."
      required: maintainer
      example: Self-assessed
    - name: Date submitted
      definition: The date on which the methodology was first submitted.
      required: maintainer
      example: 10th July 2026
    - name: Submitted by
      definition: The name (real name or GitHub user name) of the person/entity who submitted the methodology.
      required: maintainer
      example: Meth O'dology
    - name: Submission URI
      definition: Link to the GitHub issue that was used to submit and assess the methodology.
      required: maintainer
      example: https://github.com/thegreenwebfoundation/DIST/issues/13
    - name: Last updated by
      definition: The name of the maintainer who last updated this item.
      required: maintainer
      example: Fershad Irani
    - name: Last updated date
      definition: The date this item was last updated.
      required: maintainer
      example: 15th July 2026
    
